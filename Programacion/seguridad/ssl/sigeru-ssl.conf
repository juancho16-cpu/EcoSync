
<VirtualHost *:80>
    ServerName sigeru.local
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName sigeru.local
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/sigeru/sigeru.crt
    SSLCertificateKeyFile /etc/ssl/sigeru/sigeru.key

    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder on

    Header always set Strict-Transport-Security "max-age=31536000"

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/sigeru_error.log
    CustomLog ${APACHE_LOG_DIR}/sigeru_acceso.log combined
</VirtualHost>
